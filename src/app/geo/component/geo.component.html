<h2 class="title">Restaurant Locator</h2>
<form #geoForm="ngForm" (ngSubmit)="onSearch()">
  <div class="row">
    <!-- Restaurant ID Input -->
    <div class="col">
      <label for="restaurant-id" hidden>Restaurant ID</label>
      <input
        type="text"
        class="form-control"
        placeholder="Enter restaurant ID"
        id="restaurant-id"
        name="restaurant-id"
        required
        [(ngModel)]="restaurantId"
      />
    </div>

    <!-- Search Button -->
    <div class="col">
      <button
        type="submit"
        class="btn btn-primary form-control"
        id="search"
        [disabled]="!!geoForm.invalid"
      >
        Search
      </button>
    </div>
  </div>
</form>

@if (searched()) {
  <div class="row mt-3 my-3">
    <table class="table">
      <thead>
        <tr>
          <th scope="col">Id</th>
          <th scope="col">City</th>
          <th scope="col">Name</th>
          <th scope="col">Zip</th>
          <th scope="col">Lat.</th>
          <th scope="col">Lon.</th>
        </tr>
      </thead>
      <tbody>
        @for (restaurant of restaurants(); track restaurant.id) {
          <tr>
            <td>{{ restaurant.id }}</td>
            <td>{{ restaurant.city }}</td>
            <td>{{ restaurant.name }}</td>
            <td>{{ restaurant.zip }}</td>
            <td>{{ restaurant.latitude }}</td>
            <td>{{ restaurant.longitude }}</td>
          </tr>
        } @empty {
          <tr>
            <td colspan="6" class="text-center">No restaurants found.</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
}
