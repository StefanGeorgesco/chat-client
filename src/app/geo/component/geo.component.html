<h2 class="title">Restaurant Locator</h2>
<form #geoForm="ngForm" (ngSubmit)="onSearch()">
  <div class="row">
    <!-- Restaurant ID Input -->
    <div class="col">
      <label for="restaurant-id" hidden>Restaurant ID</label>
      <input
        type="text"
        class="form-control"
        placeholder="Enter restaurant ID"
        id="restaurant-id"
        name="restaurant-id"
        required
        [(ngModel)]="restaurantIdInput"
      />
    </div>

    <!-- Search Button -->
    <div class="col">
      <button
        type="submit"
        class="btn btn-primary form-control"
        id="search"
        [disabled]="!!geoForm.invalid"
      >
        Search
      </button>
    </div>
  </div>
</form>

@if (wasSearched()) {
  <div class="row mt-3 my-3">
    @if (restaurants().length > 0) {
      <google-map
        height="500px"
        width="100%"
        [center]="mapCenter()"
        [zoom]="14"
        [options]="mapOptions"
      >
        @for (restaurant of restaurants(); track restaurant.id) {
          <map-advanced-marker
            [position]="{ lat: restaurant.latitude, lng: restaurant.longitude }"
            [title]="restaurant.name"
          />
        }
      </google-map>
    } @else {
      <p class="text-center">No restaurants found.</p>
    }
  </div>
}
